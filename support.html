<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skahwk Bank - Live Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #071e3d; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
    </style>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
        var _smartsupp = _smartsupp || {};
        _smartsupp.key = '3e3a2cb2cc19e5878880c26cf620635e8ae8f2fd';
        window.smartsupp||(function(d) {
          var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
          s=d.getElementsByTagName('script')[0];c=d.createElement('script');
          c.type='text/javascript';c.charset='utf-8';c.async=true;
          c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
        })(document);
    </script>
</head>
<body class="text-white flex flex-col h-screen">
    <!-- Top Bar -->
    <div class="bg-[#0b2545] px-4 py-3 flex items-center justify-between border-b border-white/10 shadow-md">
        <div class="flex items-center space-x-2 font-bold text-sm">
            <i class="fa-solid fa-headset text-blue-400"></i>
            <span>Skahwk Customer Support</span>
        </div>
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-full text-xs font-semibold transition">
            Back to Bank
        </a>
    </div>

    <!-- Chat Notice / Loading Area -->
    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin mb-4"></div>
        <h2 class="text-sm font-semibold tracking-wide">Connecting to Live Support...</h2>
        <p class="text-xs text-white/50 mt-1">Our agents are available 24/7 to assist you.</p>
    </div>

    <script>
        // Automatically open the chat box when the page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.smartsupp) {
                    window.smartsupp('chat:open');
                }
            }, 1000);
        });
    </script>
</body>
</html>
